# 빌드는 전부 여기서 한다. 배포 대상인 1GB VM에서는 Gradle 빌드가 OOM 나기 때문에,
# jar와 프론트 dist를 Actions에서 만들어 컨테이너 이미지로 GHCR에 올린다.
# 서버는 그 이미지를 받아 실행만 한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/diy-taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/diy-taskboard-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      # 테스트는 H2 인메모리 DB로 돌아가므로(기획서 10절) 별도 DB 설정 없이 그대로 통과해야 한다.
      - name: Build and test
        run: ./gradlew build
        working-directory: backend

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # build 스크립트가 tsc -b를 먼저 돌리므로 타입 오류도 여기서 걸린다.
      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  publish:
    # main에 들어간 것만 배포용 이미지로 만든다. PR에서는 위 두 잡의 검증까지만.
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # amd64(E2)와 arm64(A1) 이미지를 함께 만들어 둔다.
      # 두 Dockerfile 모두 COPY만 하므로 교차 빌드 비용이 사실상 없다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
