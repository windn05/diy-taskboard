name: Backend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트는 H2 인메모리 DB로 돌아가므로(기획서 10절) 별도 DB 설정 없이 그대로 통과해야 한다.
      - name: Build and test
        run: ./gradlew build
