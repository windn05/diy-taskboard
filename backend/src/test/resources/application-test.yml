spring:
  datasource:
    url: jdbc:h2:mem:taskboard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-only-secret-key-please-32bytes-minimum
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    root: WARN
    com.taskboard: INFO
