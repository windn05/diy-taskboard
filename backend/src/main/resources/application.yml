# 배포 환경에서는 아래 값들을 환경변수로 덮어쓴다. 콜론 뒤는 로컬 개발용 기본값이다.
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JPA_DDL_AUTO, JPA_SHOW_SQL, PORT
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/taskboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 운영에서는 validate 또는 none 권장 — 스키마를 애플리케이션이 바꾸지 않게 한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  # 운영에서는 반드시 JWT_SECRET을 넣어야 한다. 기본값이 노출되면 토큰을 위조할 수 있다.
  secret: ${JWT_SECRET:local-only-dev-secret-key-please-32bytes-min}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

springdoc:
  # 운영에서는 SWAGGER_ENABLED=false로 끈다. API 목록을 공개할 이유가 없다.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

taskboard:
  bootstrap:
    # 계정이 하나도 없을 때만 이 값으로 최초 관리자를 만든다.
    # 공개 회원가입이 없어서, 새 DB에서 첫 관리자를 만들 유일한 통로다.
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  log:
    # 메모리 링버퍼에 유지할 최근 로그 건수. WARN/ERROR는 이와 별개로 DB에 영속된다.
    buffer-size: 500
