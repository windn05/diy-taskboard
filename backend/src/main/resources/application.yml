# 배포 환경에서는 아래 값들을 환경변수로 덮어쓴다. 콜론 뒤는 로컬 개발용 기본값이다.
#   DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST, REDIS_PORT, JPA_DDL_AUTO, JPA_SHOW_SQL, PORT
server:
  port: ${PORT:8080}
  servlet:
    session:
      # 쿠키가 크로스사이트 요청엔 안 실리므로 CSRF 토큰 없이도 안전 — 같은 오리진(Caddy/Vite 프록시) 배포 기준
      cookie:
        same-site: lax

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/taskboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 운영에서는 validate 또는 none 권장 — 스키마를 애플리케이션이 바꾸지 않게 한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # LocalDateTime을 UTC 그대로 저장·조회 (JVM 기본 시간대도 UTC로 고정)
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  session:
    # 로그인 세션을 백엔드 프로세스가 아닌 Redis에 둬서, 재배포로 컨테이너가 재시작돼도 로그인이 유지된다.
    store-type: redis
    timeout: 1h

springdoc:
  # 운영에서는 SWAGGER_ENABLED=false로 끈다. API 목록을 공개할 이유가 없다.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

taskboard:
  bootstrap:
    # 계정이 하나도 없을 때만 이 값으로 최초 관리자를 만든다.
    # 공개 회원가입이 없어서, 새 DB에서 첫 관리자를 만들 유일한 통로다.
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  log:
    # 메모리 링버퍼에 유지할 최근 로그 건수. WARN/ERROR는 이와 별개로 DB에 영속된다.
    buffer-size: 500
    # DB에 영속된 로그를 며칠치 남길지. 매일 새벽 4시에 이보다 오래된 행을 지운다.
    # 0이나 음수로 두면 미래 시각이 기준이 되어 전부 지워지므로 1 이상을 넣는다.
    retention-days: 7
