# 오라클 클라우드 VM.Standard.E2.1.Micro (1 OCPU / 1GB RAM) 기준.
# 메모리가 빠듯하므로 각 서비스에 mem_limit을 명시적으로 건다 (스왑 없이는 OOM killer가 골라 죽인다).
#
# 외부에 노출되는 포트는 caddy의 80뿐이다. db/backend는 컨테이너 내부 네트워크로만 통신하고
# 호스트 포트를 열지 않는다 — Caddy가 프론트 정적 파일 서빙과 /api, /ws 라우팅을 전부 맡는다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # 기본 100MB인 shared_buffers를 낮춰 컨테이너 메모리 제한 안에 여유를 둔다.
      POSTGRES_INITDB_ARGS: "-c shared_buffers=32MB"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 450m
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskboard
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JPA_DDL_AUTO: update # 최초 배포 확인 후 validate로 낮추는 것을 권장 (프로젝트 기획서 4.3절)
      JPA_SHOW_SQL: "false"
      PORT: 8080

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 80m
    depends_on:
      - backend
    ports:
      - "80:80"
      # 나중에 도메인을 붙이면 Caddyfile의 ":80"을 도메인으로 바꾸고 아래 443도 열어준다.
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-dist:/srv/frontend:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
